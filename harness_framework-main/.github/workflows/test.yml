name: test

on:
  push:
  pull_request:

jobs:
  runner-tests:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run runner tests
        run: python -m unittest discover -s scripts -p "test_*.py" -v

      - name: Check runner help
        run: python scripts/codex_execute.py --help
